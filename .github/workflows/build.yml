name: Build and Release

on:
  push:
    branches:
      - release  # 只在release分支推送时触发
    tags:
      - 'v*'     # 推送版本标签时触发
  workflow_dispatch:  # 手动触发（可选）

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45  # 增加超时时间

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release  # 明确指定从release分支构建

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Clear npm cache (Windows)
        run: |
          npm cache clean --force
          npm cache verify
        shell: cmd

      - name: Install dependencies
        run: |
          echo "=== 开始安装依赖 ==="
          echo "当前时间: %date% %time%"
          echo "Node版本:"
          node --version
          echo "NPM版本:"
          npm --version
          echo "工作目录:"
          cd
          
          # 清理npm缓存
          npm cache clean --force
          
          # 设置npm配置
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-timeout 300000
          npm config set fetch-retries 3
          
          echo "=== 开始npm ci ==="
          npm ci --no-audit --no-fund --prefer-offline --verbose
          
          echo "=== 依赖安装完成，开始重建原生模块 ==="
          npm rebuild sharp
          npm rebuild tesseract.js-core
          
          echo "=== 依赖安装和重建完成 ==="
          echo "完成时间: %date% %time%"
        timeout-minutes: 20
        shell: cmd

      - name: Build application
        run: |
          set NODE_OPTIONS=--max-old-space-size=4096
          npx tsc && npm run build:renderer
        timeout-minutes: 15
        shell: cmd

      - name: Build Electron app
        run: scripts/build-ci.bat win
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist-build/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-build/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
