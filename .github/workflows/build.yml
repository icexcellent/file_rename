name: Build and Release

on:
  push:
    branches:
      - release  # 只在release分支推送时触发
    tags:
      - 'v*'     # 推送版本标签时触发
  workflow_dispatch:  # 手动触发（可选）

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # 增加超时时间
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            target: dmg
          - os: windows-latest
            platform: win
            target: nsis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release  # 明确指定从release分支构建

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Clear npm cache (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npm cache clean --force
          npm cache verify
        shell: cmd

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          # 重新构建sharp等原生模块
          npm rebuild sharp
          npm rebuild tesseract.js-core
        timeout-minutes: 15
        retries: 2

      - name: Build application
        run: |
          if "%{{ matrix.os }}"=="windows-latest" (
            set NODE_OPTIONS=--max-old-space-size=4096
          ) else (
            export NODE_OPTIONS=--max-old-space-size=4096
          )
          npm run build
        timeout-minutes: 15
        retries: 2

      - name: Build Electron app
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            chmod +x scripts/build-ci.sh
            ./scripts/build-ci.sh mac
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            scripts/build-ci.bat win
          else
            chmod +x scripts/build-ci.sh
            ./scripts/build-ci.sh
          fi
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: dist-build/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mac-build/*.dmg
            win-build/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
