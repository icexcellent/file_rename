name: Build and Release

on:
  push:
    branches:
      - release  # 只在release分支推送时触发
    tags:
      - 'v*'     # 推送版本标签时触发
  workflow_dispatch:  # 手动触发（可选）

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # 添加超时设置
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            target: dmg
          - os: windows-latest
            platform: win
            target: nsis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release  # 明确指定从release分支构建

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          # 重新构建sharp等原生模块
          npm rebuild sharp
          npm rebuild tesseract.js-core

      - name: Build application
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          timeout 600 npm run build
        timeout-minutes: 10

      - name: Build Electron app
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            chmod +x scripts/build-ci.sh
            ./scripts/build-ci.sh mac
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            scripts/build-ci.bat win
          else
            chmod +x scripts/build-ci.sh
            ./scripts/build-ci.sh
          fi
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: dist-build/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mac-build/*.dmg
            win-build/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
